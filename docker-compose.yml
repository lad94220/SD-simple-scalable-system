services:
  postgres_primary:
    image: postgres:latest
    container_name: postgres_primary
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - primary_data:/var/lib/postgresql
      - ./src/libs/db/primary/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c wal_keep_size=256MB
      -c hot_standby=on
      -c synchronous_commit=on
      -c max_replication_slots=5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_replica:
    image: postgres:latest
    container_name: postgres_replica
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REPLICATION_USER: ${REPLICATION_USER}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - replica_data:/var/lib/postgresql
      - ./src/libs/db/replica/standby.conf:/etc/postgresql/conf.d/standby.conf:ro
    command: >
      bash -c "
        cp /usr/share/postgresql/postgresql.conf.sample /var/lib/postgresql/data/postgresql.conf 2>/dev/null || true;
        echo 'standby_mode = ON' >> /var/lib/postgresql/data/postgresql.conf;
        echo 'primary_conninfo = ''host=postgres_primary port=5432 user=${REPLICATION_USER} password=${REPLICATION_PASSWORD} application_name=postgres_replica''' >> /var/lib/postgresql/data/postgresql.conf;
        echo 'primary_slot_name = ''replica_slot''' >> /var/lib/postgresql/data/postgresql.conf;
        echo 'restore_command = ''/bin/true''' >> /var/lib/postgresql/data/postgresql.conf;
        postgres
      "
    depends_on:
      postgres_primary:
        condition: service_healthy
    volumes_from:
      - postgres_primary:ro

volumes:
  primary_data:
  replica_data:
